[package]
name = "filex"
version = "0.1.0"
edition = "2024"

[features]
default = ["app"]
# The GPUI application. The index library builds without it, so indexing
# logic can be cross-checked/tested for other platforms without pulling in
# UI toolchains (cargo check --no-default-features --target ...).
app = ["dep:gpui", "dep:futures", "dep:image"]

[[bin]]
name = "filex"
path = "src/main.rs"
required-features = ["app"]

[dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = { version = "0.3.32", optional = true }
gpui = { version = "0.2", optional = true }
image = { version = "0.25", optional = true }
jwalk = "0.8.1"
memchr = "2.8.3"
# Binary property-list codec for the macOS Finder tag xattr
# (`_kMDItemUserTags`). Kept portable (not macOS-gated) so the encode/
# decode logic is unit-tested on CI without needing a Mac.
plist = "1.7"
rayon = "1.12.0"
unicode-segmentation = "1.13.3"

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "tag_bench"
harness = false

[[bench]]
name = "filter_bench"
harness = false

[[bench]]
name = "bootstrap_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2-core-foundation = "0.3.2"
objc2-core-services = { version = "0.3.2", features = ["FSEvents", "dispatch2"] }
# Delete-to-trash: NSFileManager reports where the item landed, which
# the `trash` crate discards — that handle is what makes undo possible.
objc2-foundation = { version = "0.3.2", features = ["NSError", "NSFileManager", "NSString", "NSURL"] }
# statvfs for drive free/total space (shared with the Linux path).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Freedesktop trash with list/restore (undo) via os_limited.
trash = "5.2.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Recycle Bin with list/restore (undo) via os_limited.
trash = "5.2.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
