[package]
name = "filex"
version = "0.2.1"
edition = "2024"

[features]
default = ["app"]
# Local aggregate measurements and alternate search representations. Never
# enabled by the application or daemon release builds.
index-v2-lab = []
# The GPUI application. The index library builds without it, so indexing
# logic can be cross-checked/tested for other platforms without pulling in
# UI toolchains (cargo check --no-default-features --target ...).
app = [
  "dep:gpui", "dep:gpui_platform", "dep:futures", "dep:image", "dep:resvg", "dep:ureq",
  "dep:objc2", "dep:objc2-app-kit", "dep:objc2-quick-look-ui",
  "dep:raw-window-handle", "dep:windows-core", "updater",
  "windows/Win32_Graphics_Gdi", "windows/Win32_System_Com",
  "windows/Win32_System_Com_StructuredStorage", "windows/Win32_System_Ole",
  "windows/Win32_System_JobObjects", "windows/Win32_System_SystemServices",
  "windows/Win32_System_LibraryLoader", "windows/Win32_System_Threading", "windows/Win32_UI_Shell",
  "windows/Win32_UI_Shell_PropertiesSystem", "windows/Win32_UI_WindowsAndMessaging",
  "windows/Win32_UI_Input_KeyboardAndMouse",
]
# Update downloader for the UI. The per-user daemon release is built
# without default features and has no update or telemetry transport.
updater = ["dep:ureq"]
# Observability: Sentry crash/error reporting + performance measurements +
# release-health sessions, UI process only. This is the *only* telemetry
# transport (the legacy FILEX_CRASH_ENDPOINT POST uploader was removed).
# It is a *build-time* gate, not a consent gate: the filex-indexd
# daemon must never link a telemetry SDK, so it is built without this
# feature (release CI builds the service plain and the UI with it). The
# UI's consent is on-by-default/opt-out (the `crash_reports` setting), so
# shipped UI builds report by default. Uses the ureq transport + rustls to
# match filex's existing HTTP stack instead of pulling in reqwest/tokio.
# Upholds the same privacy invariant as `telemetry`: every outgoing event
# is path-scrubbed, and nothing sends without consent + an env-provided DSN.
observability = ["dep:sentry", "dep:sentry-tracing", "dep:memory-stats"]

[[bin]]
name = "filex"
path = "src/main.rs"
required-features = ["app"]

[[example]]
name = "quick_look_smoke"
required-features = ["app"]

[[example]]
name = "windows_preview_smoke"
required-features = ["app"]

[[example]]
name = "preview_benchmark"
required-features = ["app"]

[dependencies]
anyhow = "1.0.103"
dirs = "6.0.0"
# Update payload authentication: detached Ed25519 signature over the
# downloaded artifact bytes, verified before any install step runs. The
# lib only ever *verifies* (public key is embedded); signing happens in CI
# with the private key. See docs/design-distribution.md §4.
ed25519-dalek = "2"
sha2 = "0.10"
# OS randomness for one-time release keypair generation (the `filex-sign`
# helper). Verification never needs it.
getrandom = "0.2"
# Semver comparison for the update manifest's version field.
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = { version = "0.3.32", optional = true }
# Community fork of Zed's GPUI (upstream stopped publishing to crates.io).
# Exact pins: crates.io also carries stale 0.3.x gpui-ce releases.
gpui = { package = "gpui-ce", version = "=0.2.2", optional = true }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", optional = true, features = ["font-kit"] }
image = { version = "0.25", optional = true }
resvg = { version = "0.45.1", default-features = false, optional = true }
# Crash-report upload (UI process only; the daemon has no external network transport).
ureq = { version = "2.10", optional = true }
# Observability (UI process only, `observability` feature). Lean transport:
# ureq + rustls, matching filex's existing HTTP stack — no reqwest/tokio.
# NB: the "panic" integration is deliberately *omitted*. Panics are captured
# by our own hook (`telemetry::install_panic_hook`) into a durable on-disk
# queue that is drained to Sentry on the next launch — robust across aborts,
# OOM, and SIGKILL where Sentry's live in-process flush would be lost.
# Enabling "panic" here would double-report every crash (live event + drained
# event).
sentry = { version = "0.49", default-features = false, features = [
  "backtrace",
  "contexts",
  "ureq",
  "rustls",
], optional = true }
sentry-tracing = { version = "0.49", optional = true }
# Cross-platform resident-set-size query for the memory measurement
# (observability feature only); tiny, no transitive deps beyond the OS.
memory-stats = { version = "1.2", optional = true }
memchr = "2.8.3"
# Binary property-list codec for the macOS Finder tag xattr
# (`_kMDItemUserTags`). Kept portable (not macOS-gated) so the encode/
# decode logic is unit-tested on CI without needing a Mac.
plist = "1.7"
unicode-segmentation = "1.13.3"
unicode-normalization = "=0.1.24"
unicode-casefold = "=0.2.0"
memmap2 = "0.9"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
bytemuck = "1"
notify = "8"
fs2 = "0.4"

[[bin]]
name = "filex-index-lab"
path = "src/bin/filex-index-lab.rs"
required-features = ["index-v2-lab"]

[[bench]]
name = "search_bench"
harness = false

[[bench]]
name = "tag_bench"
harness = false

[[bench]]
name = "thumbnail_bench"
harness = false
required-features = ["app"]

[[bench]]
name = "filter_bench"
harness = false

[[bench]]
name = "segment_bench"
harness = false

[[bench]]
name = "listing_bench"
harness = false

[[bench]]
name = "magic_bench"
harness = false

[[bench]]
name = "suffix_probe"
harness = false
required-features = ["index-v2-lab"]

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

[target.'cfg(unix)'.dependencies]
# filex-indexd's SIGTERM/SIGINT -> stop flag (launchd/systemd clean stop).
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Native Quick Look viewer; never linked into the index daemon.
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow", "NSPanel"] }
objc2-quick-look-ui = { version = "0.3.2", optional = true, default-features = false, features = ["std", "objc2-app-kit", "QLPreviewPanel", "QLPreviewItem"] }
raw-window-handle = { version = "0.6", optional = true }
# Delete-to-trash: NSFileManager reports where the item landed, which
# the `trash` crate discards — that handle is what makes undo possible.
objc2-foundation = { version = "0.3.2", features = [
  "NSError",
  "NSFileManager",
  "NSString",
  "NSURL",
] }
# statvfs for drive free/total space (shared with the Linux path).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# Freedesktop trash with list/restore (undo) via os_limited.
trash = "5.2.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = { version = "0.62", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# Recycle Bin with list/restore (undo) via os_limited.
trash = "5.2.6"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
