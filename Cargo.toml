[package]
name = "filex"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
futures = "0.3.32"
gpui = "0.2"
jwalk = "0.8.1"
memchr = "2.8.3"
rayon = "1.12.0"

[[bench]]
name = "search_bench"
harness = false

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2-core-foundation = "0.3.2"
objc2-core-services = { version = "0.3.2", features = ["FSEvents", "dispatch2"] }
