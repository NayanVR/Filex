# Release pipeline — runs on a version tag (e.g. v1.4.0). Builds each
# platform's artifact, signs it with our own Ed25519 key (the boundary that
# replaces OS code signing — see docs/design-distribution.md §4), publishes
# a GitHub Release with the artifacts + per-platform update manifest, and
# bumps the Homebrew cask.
#
# The update client fetches the manifest at the STABLE url
#   https://github.com/<owner>/<repo>/releases/latest/download/filex-<os>.json
# which always resolves to the newest release; each manifest's `url` points
# at that release's immutable, tagged artifact asset.
#
# Required secrets:
#   FILEX_SIGNING_KEY  — hex Ed25519 private key from `filex-sign keygen`.
#   TAP_DEPLOY_KEY     — private half of a write-enabled SSH deploy key on the
#                        Homebrew tap repo (never expires, scoped to that repo).
# Optional secrets:
#   FILEX_POSTHOG_KEY  — PostHog project API key (public by design: it can
#                        only write events) compiled into the UI app for
#                        analytics and error tracking. When unset, analytics
#                        is simply disabled in the shipped build. The daemon
#                        and updater binaries are always built without it.
# Optional variables (repository Variables, not secrets):
#   FILEX_POSTHOG_HOST — ingestion host for the project's region or a
#                        reverse proxy, e.g. https://eu.i.posthog.com.
#                        Defaults to https://us.i.posthog.com.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

env:
  CARGO_TERM_COLOR: always
  # The Homebrew tap repository the cask lives in (owner/repo).
  TAP_REPO: NayanVR/homebrew-filex

jobs:
  # --- Windows: MSI (app + per-user daemon + update service), signed --------
  # Every binary built here must be in src/updater/components.rs (tests
  # enforce it).
  windows:
    name: windows (msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX Toolset v3
        run: choco install wixtoolset --no-progress -y
      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw "WiX candle.exe not found after install" }
          Add-Content $env:GITHUB_PATH $candle.Directory.FullName
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
        env:
          RUSTFLAGS: ""
      # The search daemon and the update service must never link a
      # telemetry transport, so build them (and filex-sign) without default
      # features; the updater gets only `updater`, the UI app gets
      # `analytics`. All land in target/release for cargo-wix to package.
      # FILEX_POSTHOG_KEY is compiled into the app when the secret is set,
      # and is simply absent (analytics stays disabled) when it isn't.
      - name: Build release (daemon + updater without telemetry; app with analytics)
        shell: bash
        env:
          FILEX_POSTHOG_KEY: ${{ secrets.FILEX_POSTHOG_KEY }}
          FILEX_POSTHOG_HOST: ${{ vars.FILEX_POSTHOG_HOST }}
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --bin filex-indexd
          cargo build --release --locked --no-default-features --features updater --bin filex-updater
          cargo build --release --locked --features analytics --bin filex
          cargo build --release --locked -p filex-dialog-shim
      - name: Build the MSI
        # The repo is a Cargo workspace (the dialog shim crate), so cargo-wix
        # needs to be told which package's wix/main.wxs to build.
        run: cargo wix --no-build -v --package filex
      # Install/uninstall smoke test of the exact MSI about to ship, before
      # it is signed or published: binaries land, the update service
      # registers demand-start and boots, Settings > Integration
      # registrations are undone on uninstall, crash-report opt-out, clean
      # removal. A failure here stops the release.
      - name: Smoke test the MSI (install, verify, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # We check native exit codes manually (sc.exe is *expected* to
          # exit non-zero once the service is gone), so don't let non-zero
          # native exits throw on PowerShell 7.4+.
          $PSNativeCommandUseErrorActionPreference = $false
          $msi = Get-ChildItem target\wix\*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was produced" }
          Write-Host "Installing $($msi.FullName)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed (exit $($p.ExitCode))" }
          if (-not (Test-Path "C:\Program Files\Filex\filex-indexd.exe")) { throw "filex-indexd.exe not installed" }
          # V2 uses a per-user daemon, not an elevated machine-wide endpoint.
          if (-not (Test-Path "C:\Program Files\Filex\filex.exe")) { throw "UI was not installed" }
          if (-not (Test-Path "C:\Program Files\Filex\filex-updater.exe")) { throw "filex-updater.exe not installed" }
          if (-not (Test-Path "C:\Program Files\Filex\filex_dialog_shim.dll")) { throw "filex_dialog_shim.dll not installed" }
          # The update service: demand start, LocalSystem.
          $qc = (sc.exe qc filex-updater) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "filex-updater service not registered:`n$qc" }
          if ($qc -notmatch 'DEMAND_START') { throw "filex-updater should be demand-start:`n$qc" }
          if ($qc -notmatch 'LocalSystem') { throw "filex-updater should run as LocalSystem:`n$qc" }
          # The MSI starts it once after install; on boot it grants interactive
          # users SERVICE_START (RP) on itself. Proves the service binary boots.
          $granted = $false
          for ($i = 0; $i -lt 30 -and -not $granted; $i++) {
            $sd = (sc.exe sdshow filex-updater) -join ''
            $granted = $sd -match '\(A;;CCLCSWRPLOCRRC;;;IU\)'
            if (-not $granted) { Start-Sleep -Seconds 1 }
          }
          if (-not $granted) {
            Get-ChildItem "C:\Windows\System32\config\systemprofile\AppData\Local\filex\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            throw "filex-updater did not set its service DACL (got: $sd)"
          }
          # The privacy page's crash-report choice: on by default, and an
          # unattended FILEX_CRASH_REPORTS=0 opts out (checked below).
          $crash = (Get-ItemProperty "HKLM:\Software\Filex").CrashReports
          if ($crash -ne 1) { throw "CrashReports should default to 1, got '$crash'" }
          # Settings > Integration, both switches on, as this user. Uninstall
          # must undo them so folders and file dialogs never point at
          # deleted files (docs/design-default-explorer.md).
          foreach ($flag in '--register-default', '--register-dialogs') {
            $p = Start-Process "C:\Program Files\Filex\filex.exe" -ArgumentList $flag -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "filex $flag failed (exit $($p.ExitCode))" }
          }
          $verb = (Get-ItemProperty "HKCU:\Software\Classes\Directory\shell").'(default)'
          if ($verb -ne 'filex') { throw "Directory default verb should be filex, got '$verb'" }
          $openDialog = 'HKCU:\Software\Classes\CLSID\{DC1C5A9C-E88A-4dde-A5A1-60F82A20AEF7}\InprocServer32'
          if (-not (Test-Path $openDialog)) { throw "dialog shim was not registered" }
          Write-Host "Uninstalling"
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "uninstall failed (exit $($p.ExitCode))" }
          if (Test-Path "HKCU:\Software\Classes\Directory\shell\filex") { throw "uninstall left the folder verb registered" }
          if (Test-Path $openDialog) { throw "uninstall left the dialog shim registered" }
          $verb = (Get-ItemProperty "HKCU:\Software\Classes\Directory\shell" -ErrorAction SilentlyContinue).'(default)'
          if ($verb -eq 'filex') { throw "uninstall left filex as the Directory default verb" }
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart FILEX_CRASH_REPORTS=0 /l*v optout.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content optout.log -Tail 60; throw "opt-out install failed (exit $($p.ExitCode))" }
          $crash = (Get-ItemProperty "HKLM:\Software\Filex").CrashReports
          if ($crash -ne 0) { throw "FILEX_CRASH_REPORTS=0 should write 0, got '$crash'" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart /l*v uninstall2.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall2.log -Tail 60; throw "second uninstall failed (exit $($p.ExitCode))" }
          if (Test-Path "HKLM:\Software\Filex") { throw "HKLM\Software\Filex left behind after uninstall" }
          sc.exe query filex-indexd 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "filex-indexd service still present after uninstall" }
          sc.exe query filex-updater 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "filex-updater service still present after uninstall" }
          if (Test-Path "C:\Program Files\Filex") { throw "C:\Program Files\Filex left behind after uninstall" }
          Write-Host "MSI smoke test passed"
          # Don't leak the last (intentionally non-zero) native exit code.
          exit 0
      - name: Build filex-sign
        run: cargo build --release --locked --no-default-features --bin filex-sign
      - name: Sign artifact + write manifest
        shell: bash
        env:
          FILEX_SIGNING_KEY: ${{ secrets.FILEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MSI="$(ls target/wix/*.msi | head -n1)"
          ASSET="Filex-${VERSION}-x64.msi"
          cp "$MSI" "$ASSET"
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          ./target/release/filex-sign sign \
            --version "$VERSION" --url "$URL" \
            --in "$ASSET" --out filex-windows.json
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Filex-*-x64.msi
            filex-windows.json

  # --- Linux: tarball of the binary, signed -----------------------------
  linux:
    name: linux (tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev
      - name: Build release
        env:
          FILEX_POSTHOG_KEY: ${{ secrets.FILEX_POSTHOG_KEY }}
          FILEX_POSTHOG_HOST: ${{ vars.FILEX_POSTHOG_HOST }}
        run: |
          cargo build --release --locked --no-default-features --bin filex-indexd
          cargo build --release --locked --features analytics --bin filex
      - name: Build filex-sign
        run: cargo build --release --locked --no-default-features --bin filex-sign
      - name: Package + sign
        env:
          FILEX_SIGNING_KEY: ${{ secrets.FILEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="filex-${VERSION}-linux-x86_64.tar.gz"
          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"' EXIT
          cp target/release/filex target/release/filex-indexd "$STAGING/"
          cp packaging/linux/dev.filex.app.desktop "$STAGING/dev.filex.app.desktop"
          cp assets/branding/filex.png "$STAGING/filex.png"
          tar -C "$STAGING" -czf "$ASSET" filex filex-indexd dev.filex.app.desktop filex.png
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          ./target/release/filex-sign sign \
            --version "$VERSION" --url "$URL" \
            --in "$ASSET" --out filex-linux.json
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            filex-*-linux-x86_64.tar.gz
            filex-linux.json

  # --- macOS: ad-hoc-signed .app in a tarball (Homebrew cask) -----------
  # NOTE: builds for the runner's arch only (arm64 on macos-14+). Intel
  # Macs would need a separate x86_64 / universal build — deferred.
  macos:
    name: macos (app tarball)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
      asset: ${{ steps.pkg.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        env:
          FILEX_POSTHOG_KEY: ${{ secrets.FILEX_POSTHOG_KEY }}
          FILEX_POSTHOG_HOST: ${{ vars.FILEX_POSTHOG_HOST }}
        run: |
          cargo build --release --locked --no-default-features --bin filex-indexd
          cargo build --release --locked --features analytics --bin filex
      - name: Build filex-sign
        run: cargo build --release --locked --no-default-features --bin filex-sign
      - name: Bundle .app, ad-hoc sign, package + sign
        id: pkg
        env:
          FILEX_SIGNING_KEY: ${{ secrets.FILEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="Filex.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/filex "$APP/Contents/MacOS/filex"
          cp target/release/filex-indexd "$APP/Contents/MacOS/filex-indexd"
          cp assets/branding/filex.icns "$APP/Contents/Resources/filex.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Filex</string>
            <key>CFBundleDisplayName</key><string>Filex</string>
            <key>CFBundleIdentifier</key><string>dev.filex.app</string>
            <key>CFBundleExecutable</key><string>filex</string>
            <key>CFBundleIconFile</key><string>filex.icns</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Ad-hoc signature (free): required for the binary to run on Apple
          # Silicon; does NOT clear Gatekeeper (one first-launch prompt, by
          # design — docs/design-distribution.md decision 2).
          codesign --force --deep --sign - "$APP"
          ASSET="filex-${VERSION}-macos.tar.gz"
          tar -czf "$ASSET" "$APP"
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          ./target/release/filex-sign sign \
            --version "$VERSION" --url "$URL" \
            --in "$ASSET" --out filex-macos.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ASSET" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            filex-*-macos.tar.gz
            filex-macos.json

  # --- Bump the Homebrew cask in the tap repo ---------------------------
  homebrew:
    name: bump homebrew cask
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Render cask
        env:
          VERSION: ${{ needs.macos.outputs.version }}
          SHA256: ${{ needs.macos.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          cat > tap/Casks/filex.rb <<CASK
          cask "filex" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/filex-#{version}-macos.tar.gz"
            name "Filex"
            desc "Fast cross-platform file explorer"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "Filex.app"

            # Quit the app before an upgrade; Homebrew reopens it afterwards. A
            # running filex-indexd isn't stopped here: it notices its replaced binary
            # and restarts itself (FIL-21).
            uninstall quit: "dev.filex.app"

            # Only on --zap. An uninstall launchctl: entry also runs on every upgrade and
            # deletes the plist of the opt-in launch agent (packaging/launchd).
            zap launchctl: "dev.filex.indexd"
          end
          CASK
      - name: Commit + push
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/filex.rb
          git commit -m "filex ${{ needs.macos.outputs.version }}" || { echo "no change"; exit 0; }
          git push
