name: Windows Preview Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-thumbnail-benchmark

      - name: Record machine, desktop and installed preview providers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-results | Out-Null
          & {
            "Commit: $env:GITHUB_SHA"
            "Runner image: $env:ImageOS / $env:ImageVersion"
            "Interactive: $([Environment]::UserInteractive)"
            Get-Process -Id $PID | Select-Object SessionId | Format-List
            Get-CimInstance Win32_OperatingSystem |
              Select-Object Caption, Version, BuildNumber, TotalVisibleMemorySize | Format-List
            Get-CimInstance Win32_Processor |
              Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
            Get-CimInstance Win32_VideoController |
              Select-Object Name, DriverVersion, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List
            rustc --version --verbose
            cargo --version
          } | Out-File benchmark-results/environment.txt
          $providers = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PreviewHandlers'
          if (Test-Path $providers) {
            Get-ItemProperty $providers | ConvertTo-Json | Set-Content benchmark-results/preview-providers.json
          } else {
            '{"status":"no PreviewHandlers registry key"}' | Set-Content benchmark-results/preview-providers.json
          }

      - name: Ensure generated video fixture support
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -version | Out-File benchmark-results/ffmpeg.txt

      - name: Test measurement accounting and watchdogs
        run: python -m unittest discover -s scripts -p test_preview_benchmark.py
      - name: Test production thumbnail safeguards and reused UI components
        run: cargo test --locked --example preview_benchmark
      - name: Build optimized measurement worker
        run: cargo build --locked --release --example preview_benchmark
      - name: Measure thumbnails, memory, live scrolling and native preview lifecycle
        timeout-minutes: 45
        run: python scripts/preview_benchmark.py --exe target/release/examples/preview_benchmark.exe --output benchmark-results

      - name: Publish readable report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path benchmark-results/summary.md) {
            Get-Content benchmark-results/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY
          } else {
            'Benchmark did not produce a report. Inspect the failed step and artifact logs.' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload report, raw measurements and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-benchmark
          path: |
            benchmark-results/*.json
            benchmark-results/*.md
            benchmark-results/*.html
            benchmark-results/*.txt
            benchmark-results/*.log
            benchmark-results/*.png
          retention-days: 14
          if-no-files-found: warn
