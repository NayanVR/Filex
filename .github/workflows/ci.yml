# Portable tests plus app builds/tests on Windows, Linux, and macOS.
# The native Quick Look event-loop smoke still requires a local GUI session.
# Library tests run the portable notify adapters and v2 recovery/IPC path.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A new push to a PR supersedes the run still going for the old head.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debuginfo in CI dev/test builds: faster compiles and links, and a
  # much smaller target/ for rust-cache to save and restore. Panic messages
  # keep their file:line.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - features: index-v2-lab
          # The update service's Windows plumbing (pipe, SCM, processes) only
          # compiles with `updater`; this also builds the filex-updater bin.
          - os: windows-latest
            features: index-v2-lab,updater
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `index-v2-lab` only adds code, so one run with it covers the plain
      # suite too (fixtures, live watcher smoke tests, v2 lab tests).
      - name: Run index library tests (incl. v2 lab${{ contains(matrix.features, 'updater') && ' + update service' || '' }})
        run: cargo test --locked --no-default-features --features ${{ matrix.features }}
      # The shipped daemon builds without the lab feature: check that config
      # (dead code there fails `-D warnings`), and benches, which `cargo test`
      # doesn't build.
      - name: Check all library targets without lab (incl. benches)
        run: cargo check --locked --all-targets --no-default-features

  build-app:
    name: build app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libwayland-dev libvulkan-dev libfontconfig-dev
      - name: Build the GPUI application
        run: cargo build --locked
      - name: Run application regression tests
        run: cargo test --locked --bin filex
      - name: Test preview routing and bounded protocol
        run: cargo test --locked --lib platform_preview
      - name: Run production Windows preview lifecycle and fault checks
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: cargo run --locked --example windows_preview_smoke
        env:
          FILEX_PREVIEW_SMOKE_OUTPUT: preview-smoke
      - name: Upload Windows preview screenshots
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-smoke
          path: preview-smoke/*.png
          if-no-files-found: ignore
      - name: Compile native preview lifecycle check
        if: matrix.os == 'macos-latest'
        run: cargo check --locked --example quick_look_smoke
