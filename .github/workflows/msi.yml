# Windows MSI build + install/uninstall smoke test. A full release build
# (~3 min of runner time), so PRs only run it when they touch what the MSI
# packages or the smoke test exercises; every push to main runs it, and it
# can be run by hand on any branch.
name: MSI

on:
  push:
    branches: [master, main]
  pull_request:
    paths:
      - wix/**
      - crates/**
      - build.rs
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - src/bin/**
      - src/updater/**
      - src/shell_integration/**
      - src/launch.rs
      - src/settings.rs
      - .github/workflows/msi.yml
  workflow_dispatch:

concurrency:
  group: msi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Build the Windows MSI (app + per-user daemon + update service) and
  # smoke-test that it installs them, that the update service registers
  # demand-start and boots (it grants users SERVICE_START on first run), and
  # that everything uninstalls cleanly.
  msi:
    name: MSI installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX Toolset v3
        run: choco install wixtoolset --no-progress -y
      - name: Add WiX to PATH
        shell: pwsh
        run: |
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw "WiX candle.exe not found after install" }
          Add-Content $env:GITHUB_PATH $candle.Directory.FullName
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
        # Don't apply our `-D warnings` to a third-party tool's own build.
        env:
          RUSTFLAGS: ""
      - name: Build release binaries (app + daemon + dialog shim)
        run: |
          cargo build --release --locked
          cargo build --release --locked -p filex-dialog-shim
      - name: Build the MSI
        # The repo is a Cargo workspace (the dialog shim crate), so cargo-wix
        # needs to be told which package's wix/main.wxs to build.
        run: cargo wix --no-build -v --package filex
      - name: Smoke test (install, verify binaries, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # We check native exit codes manually (sc.exe is *expected* to
          # exit non-zero once the service is gone), so don't let non-zero
          # native exits throw on PowerShell 7.4+.
          $PSNativeCommandUseErrorActionPreference = $false
          $msi = Get-ChildItem target\wix\*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI was produced" }
          Write-Host "Installing $($msi.FullName)"
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed (exit $($p.ExitCode))" }
          if (-not (Test-Path "C:\Program Files\Filex\filex-indexd.exe")) { throw "filex-indexd.exe not installed" }
          # V2 uses a per-user daemon, not an elevated machine-wide endpoint.
          if (-not (Test-Path "C:\Program Files\Filex\filex.exe")) { throw "UI was not installed" }
          if (-not (Test-Path "C:\Program Files\Filex\filex-updater.exe")) { throw "filex-updater.exe not installed" }
          if (-not (Test-Path "C:\Program Files\Filex\filex_dialog_shim.dll")) { throw "filex_dialog_shim.dll not installed" }
          # The update service: demand start, LocalSystem.
          $qc = (sc.exe qc filex-updater) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "filex-updater service not registered:`n$qc" }
          if ($qc -notmatch 'DEMAND_START') { throw "filex-updater should be demand-start:`n$qc" }
          if ($qc -notmatch 'LocalSystem') { throw "filex-updater should run as LocalSystem:`n$qc" }
          # The MSI starts it once after install; on boot it grants interactive
          # users SERVICE_START (RP) on itself. Proves the service binary boots.
          $granted = $false
          for ($i = 0; $i -lt 30 -and -not $granted; $i++) {
            $sd = (sc.exe sdshow filex-updater) -join ''
            $granted = $sd -match '\(A;;CCLCSWRPLOCRRC;;;IU\)'
            if (-not $granted) { Start-Sleep -Seconds 1 }
          }
          if (-not $granted) {
            Get-ChildItem "C:\Windows\System32\config\systemprofile\AppData\Local\filex\logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            throw "filex-updater did not set its service DACL (got: $sd)"
          }
          # The privacy page's crash-report choice: on by default, and an
          # unattended FILEX_CRASH_REPORTS=0 opts out (checked below).
          $crash = (Get-ItemProperty "HKLM:\Software\Filex").CrashReports
          if ($crash -ne 1) { throw "CrashReports should default to 1, got '$crash'" }
          # Settings > Integration, both switches on, as this user. Uninstall
          # must undo them so folders and file dialogs never point at
          # deleted files (docs/design-default-explorer.md).
          foreach ($flag in '--register-default', '--register-dialogs') {
            $p = Start-Process "C:\Program Files\Filex\filex.exe" -ArgumentList $flag -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "filex $flag failed (exit $($p.ExitCode))" }
          }
          $verb = (Get-ItemProperty "HKCU:\Software\Classes\Directory\shell").'(default)'
          if ($verb -ne 'filex') { throw "Directory default verb should be filex, got '$verb'" }
          $openDialog = 'HKCU:\Software\Classes\CLSID\{DC1C5A9C-E88A-4dde-A5A1-60F82A20AEF7}\InprocServer32'
          if (-not (Test-Path $openDialog)) { throw "dialog shim was not registered" }
          Write-Host "Uninstalling"
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart /l*v uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "uninstall failed (exit $($p.ExitCode))" }
          if (Test-Path "HKCU:\Software\Classes\Directory\shell\filex") { throw "uninstall left the folder verb registered" }
          if (Test-Path $openDialog) { throw "uninstall left the dialog shim registered" }
          $verb = (Get-ItemProperty "HKCU:\Software\Classes\Directory\shell" -ErrorAction SilentlyContinue).'(default)'
          if ($verb -eq 'filex') { throw "uninstall left filex as the Directory default verb" }
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /quiet /norestart FILEX_CRASH_REPORTS=0 /l*v optout.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content optout.log -Tail 60; throw "opt-out install failed (exit $($p.ExitCode))" }
          $crash = (Get-ItemProperty "HKLM:\Software\Filex").CrashReports
          if ($crash -ne 0) { throw "FILEX_CRASH_REPORTS=0 should write 0, got '$crash'" }
          $p = Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /quiet /norestart /l*v uninstall2.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall2.log -Tail 60; throw "second uninstall failed (exit $($p.ExitCode))" }
          if (Test-Path "HKLM:\Software\Filex") { throw "HKLM\Software\Filex left behind after uninstall" }
          sc.exe query filex-indexd 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "filex-indexd service still present after uninstall" }
          sc.exe query filex-updater 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "filex-updater service still present after uninstall" }
          if (Test-Path "C:\Program Files\Filex") { throw "C:\Program Files\Filex left behind after uninstall" }
          Write-Host "MSI smoke test passed"
          # Don't leak the last (intentionally non-zero) native exit code.
          exit 0
      - name: Upload MSI artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filex-msi
          path: target/wix/*.msi
          if-no-files-found: ignore
